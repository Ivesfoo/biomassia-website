<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ec5e8"/>
      <stop offset="55%" stop-color="#c3dcea"/>
      <stop offset="100%" stop-color="#e4ecdd"/>
    </linearGradient>

    <!-- Mountain gradients -->
    <linearGradient id="mountFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ca690"/>
      <stop offset="100%" stop-color="#6d8a74"/>
    </linearGradient>
    <linearGradient id="mountMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4e7352"/>
      <stop offset="100%" stop-color="#3b5c3f"/>
    </linearGradient>
    <linearGradient id="mountNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f5236"/>
      <stop offset="100%" stop-color="#223d28"/>
    </linearGradient>

    <!-- Log colors -->
    <radialGradient id="logEnd" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#c89a66"/>
      <stop offset="60%" stop-color="#a07040"/>
      <stop offset="100%" stop-color="#704e28"/>
    </radialGradient>
    <linearGradient id="logSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5e30"/>
      <stop offset="100%" stop-color="#5a3d1c"/>
    </linearGradient>

    <!-- Ground gradient -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a89880"/>
      <stop offset="100%" stop-color="#6d5f4a"/>
    </linearGradient>

    <!-- Chip pile -->
    <radialGradient id="chip" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#b08860"/>
      <stop offset="60%" stop-color="#7f5a2e"/>
      <stop offset="100%" stop-color="#4e381c"/>
    </radialGradient>

    <!-- Warehouse steel -->
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5a4c"/>
      <stop offset="100%" stop-color="#2d382f"/>
    </linearGradient>

    <!-- Roof -->
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6b5c"/>
      <stop offset="100%" stop-color="#3a4a3c"/>
    </linearGradient>

    <!-- Palm trees -->
    <linearGradient id="palmLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7a3e"/>
      <stop offset="100%" stop-color="#2d5a24"/>
    </linearGradient>

    <!-- Excavator yellow -->
    <linearGradient id="excavator" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b840"/>
      <stop offset="100%" stop-color="#b88a20"/>
    </linearGradient>
  </defs>

  <!-- SKY -->
  <rect width="1600" height="700" fill="url(#sky)"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="300" cy="120" rx="90" ry="18"/>
    <ellipse cx="340" cy="110" rx="55" ry="14"/>
    <ellipse cx="900" cy="80" rx="110" ry="20"/>
    <ellipse cx="950" cy="70" rx="60" ry="15"/>
    <ellipse cx="1350" cy="140" rx="80" ry="16"/>
  </g>

  <!-- FAR MOUNTAINS -->
  <path d="M0 320 L120 240 L260 290 L400 220 L560 280 L720 230 L880 270 L1040 210 L1200 260 L1360 230 L1500 270 L1600 250 L1600 400 L0 400 Z" fill="url(#mountFar)" opacity="0.85"/>

  <!-- MID MOUNTAINS / FOREST LINE -->
  <path d="M0 360 L80 310 L180 340 L300 290 L440 330 L580 300 L740 340 L900 290 L1060 330 L1220 300 L1380 340 L1520 310 L1600 335 L1600 450 L0 450 Z" fill="url(#mountMid)"/>

  <!-- Tree silhouettes layer -->
  <g fill="#2d4a30" opacity="0.9">
    <path d="M0 390 L30 360 L60 390 Z"/>
    <path d="M70 395 L95 365 L120 395 Z"/>
    <path d="M130 400 L155 370 L180 400 Z"/>
    <path d="M190 395 L215 360 L240 395 Z"/>
    <path d="M250 400 L275 370 L300 400 Z"/>
    <path d="M310 395 L335 365 L360 395 Z"/>
    <path d="M370 400 L395 370 L420 400 Z"/>
    <path d="M430 395 L455 360 L480 395 Z"/>
    <path d="M490 400 L515 370 L540 400 Z"/>
    <path d="M550 395 L575 365 L600 395 Z"/>
    <path d="M610 400 L635 370 L660 400 Z"/>
    <path d="M670 395 L695 360 L720 395 Z"/>
    <path d="M730 400 L755 370 L780 400 Z"/>
    <path d="M790 395 L815 365 L840 395 Z"/>
    <path d="M850 400 L875 370 L900 400 Z"/>
    <path d="M910 395 L935 360 L960 395 Z"/>
    <path d="M970 400 L995 370 L1020 400 Z"/>
    <path d="M1030 395 L1055 365 L1080 395 Z"/>
    <path d="M1090 400 L1115 370 L1140 400 Z"/>
    <path d="M1150 395 L1175 360 L1200 395 Z"/>
    <path d="M1210 400 L1235 370 L1260 400 Z"/>
    <path d="M1270 395 L1295 365 L1320 395 Z"/>
    <path d="M1330 400 L1355 370 L1380 400 Z"/>
    <path d="M1390 395 L1415 360 L1440 395 Z"/>
    <path d="M1450 400 L1475 370 L1500 400 Z"/>
    <path d="M1510 395 L1535 365 L1560 395 Z"/>
  </g>

  <!-- NEAR DARKER TREE LINE -->
  <path d="M0 420 L0 460 L1600 460 L1600 420 Q1400 400 1200 420 Q1000 410 800 425 Q600 405 400 425 Q200 415 0 420 Z" fill="url(#mountNear)"/>

  <!-- PALM TREES mid-left -->
  <g transform="translate(130, 290)">
    <rect x="-4" y="0" width="8" height="150" fill="#5a4028"/>
    <path d="M0 10 Q-40 -10 -70 0 Q-45 5 -5 20 Z" fill="url(#palmLeaf)"/>
    <path d="M0 15 Q35 -10 65 5 Q40 10 5 25 Z" fill="url(#palmLeaf)"/>
    <path d="M0 5 Q-20 -30 -45 -40 Q-25 -20 -3 10 Z" fill="url(#palmLeaf)"/>
    <path d="M0 5 Q25 -30 55 -35 Q30 -20 3 12 Z" fill="url(#palmLeaf)"/>
    <path d="M0 15 Q-5 -25 0 -55 Q5 -25 0 15 Z" fill="url(#palmLeaf)"/>
  </g>
  <g transform="translate(200, 310)">
    <rect x="-4" y="0" width="8" height="130" fill="#5a4028"/>
    <path d="M0 8 Q-35 -8 -60 2 Q-40 6 -5 18 Z" fill="url(#palmLeaf)"/>
    <path d="M0 12 Q30 -8 55 4 Q35 8 5 22 Z" fill="url(#palmLeaf)"/>
    <path d="M0 4 Q-15 -25 -40 -35 Q-20 -18 -3 8 Z" fill="url(#palmLeaf)"/>
    <path d="M0 4 Q20 -25 48 -30 Q25 -18 3 10 Z" fill="url(#palmLeaf)"/>
  </g>
  <g transform="translate(1200, 300)">
    <rect x="-4" y="0" width="8" height="140" fill="#5a4028"/>
    <path d="M0 8 Q-35 -8 -60 2 Q-40 6 -5 18 Z" fill="url(#palmLeaf)"/>
    <path d="M0 12 Q30 -8 55 4 Q35 8 5 22 Z" fill="url(#palmLeaf)"/>
    <path d="M0 4 Q-15 -25 -40 -35 Q-20 -18 -3 8 Z" fill="url(#palmLeaf)"/>
    <path d="M0 4 Q20 -25 48 -30 Q25 -18 3 10 Z" fill="url(#palmLeaf)"/>
  </g>

