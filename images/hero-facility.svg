    <rect x="60" y="0" width="140" height="8" fill="#2a3a2c"/>
    <rect x="130" y="8" width="40" height="30" fill="#1a2a1c"/>
    <!-- Bottom hopper / base -->
    <rect x="0" y="170" width="240" height="30" fill="#2d382f"/>
    <!-- Side support -->
    <rect x="210" y="60" width="15" height="130" fill="url(#steel)"/>
    <!-- Motor housing -->
    <rect x="200" y="150" width="50" height="40" fill="#4a5a4c"/>
    <circle cx="225" cy="170" r="12" fill="#2a2a2a"/>
    <circle cx="225" cy="170" r="7" fill="#4a4a4a"/>
  </g>

  <!-- ====== WOOD CHIP PILE (right foreground) ====== -->
  <g transform="translate(1200, 540)">
    <!-- Pile base shape -->
    <path d="M0 160 Q0 80 150 50 Q300 20 400 60 Q450 100 400 160 Z" fill="url(#chip)"/>
    <!-- Texture dots -->
    <g fill="#5a3d1c">
      <circle cx="40" cy="140" r="2"/>
      <circle cx="60" cy="130" r="2.5"/>
      <circle cx="80" cy="120" r="2"/>
      <circle cx="100" cy="110" r="2.5"/>
      <circle cx="130" cy="100" r="2"/>
      <circle cx="160" cy="90" r="2.5"/>
      <circle cx="190" cy="85" r="2"/>
      <circle cx="220" cy="80" r="2.5"/>
      <circle cx="250" cy="75" r="2"/>
      <circle cx="280" cy="80" r="2.5"/>
      <circle cx="310" cy="90" r="2"/>
      <circle cx="340" cy="100" r="2.5"/>
      <circle cx="370" cy="120" r="2"/>
      <circle cx="50" cy="155" r="2"/>
      <circle cx="110" cy="145" r="2.5"/>
      <circle cx="170" cy="135" r="2"/>
      <circle cx="230" cy="130" r="2.5"/>
      <circle cx="290" cy="135" r="2"/>
      <circle cx="350" cy="145" r="2.5"/>
    </g>
    <g fill="#b89060" opacity="0.6">
      <circle cx="100" cy="90" r="2"/>
      <circle cx="180" cy="75" r="2"/>
      <circle cx="260" cy="70" r="2"/>
      <circle cx="200" cy="110" r="2"/>
      <circle cx="300" cy="105" r="2"/>
    </g>
  </g>

  <!-- Smaller chip spill left foreground -->
  <g transform="translate(50, 620)">
    <path d="M0 70 Q50 20 150 35 Q200 50 180 70 Z" fill="url(#chip)" opacity="0.95"/>
    <g fill="#5a3d1c">
      <circle cx="30" cy="60" r="2"/>
      <circle cx="60" cy="50" r="2"/>
      <circle cx="90" cy="45" r="2"/>
      <circle cx="120" cy="50" r="2"/>
      <circle cx="150" cy="60" r="2"/>
    </g>
  </g>

  <!-- Soft vignette for text contrast -->
  <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
    <stop offset="45%" stop-color="#000" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
  <rect width="1600" height="700" fill="url(#vignette)"/>
</svg>
