  <rect x="0" y="460" width="1600" height="240" fill="url(#ground)"/>
  <!-- Floor shading -->
  <path d="M0 460 L1600 460 L1600 490 L0 500 Z" fill="#9a8a74" opacity="0.6"/>
  <!-- Concrete lines -->
  <g stroke="#5a4e3e" stroke-width="1" opacity="0.25">
    <line x1="0" y1="570" x2="1600" y2="580"/>
    <line x1="0" y1="640" x2="1600" y2="650"/>
  </g>

  <!-- ====== LEFT WAREHOUSE STRUCTURE ====== -->
  <!-- Roof -->
  <polygon points="0,180 420,180 420,230 0,230" fill="url(#roof)"/>
  <polygon points="0,175 420,175 420,185 0,185" fill="#2a3a2c"/>
  <!-- Vertical steel supports -->
  <g fill="url(#steel)">
    <rect x="20" y="185" width="12" height="275"/>
    <rect x="130" y="185" width="12" height="275"/>
    <rect x="260" y="185" width="12" height="275"/>
    <rect x="390" y="185" width="12" height="275"/>
  </g>
  <!-- Horizontal beam -->
  <rect x="0" y="225" width="420" height="8" fill="#3a4a3c"/>

  <!-- ====== RIGHT WAREHOUSE STRUCTURE ====== -->
  <polygon points="1180,180 1600,180 1600,230 1180,230" fill="url(#roof)"/>
  <polygon points="1180,175 1600,175 1600,185 1180,185" fill="#2a3a2c"/>
  <g fill="url(#steel)">
    <rect x="1200" y="185" width="12" height="275"/>
    <rect x="1340" y="185" width="12" height="275"/>
    <rect x="1470" y="185" width="12" height="275"/>
    <rect x="1580" y="185" width="12" height="275"/>
  </g>
  <rect x="1180" y="225" width="420" height="8" fill="#3a4a3c"/>

  <!-- ====== LOG PILE (large, center-left behind excavator) ====== -->
