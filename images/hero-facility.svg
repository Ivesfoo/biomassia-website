    <!-- Back rows of log ends -->
    <g>
      <ellipse cx="20" cy="20" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="55" cy="20" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="90" cy="18" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="125" cy="22" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="160" cy="18" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="195" cy="22" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="230" cy="18" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="265" cy="22" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="300" cy="18" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="335" cy="22" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="370" cy="18" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="405" cy="22" rx="18" ry="18" fill="url(#logEnd)"/>
