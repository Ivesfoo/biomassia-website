      <circle cx="50" cy="130" r="3"/>
      <circle cx="60" cy="125" r="2.5"/>
      <circle cx="80" cy="110" r="3"/>
      <circle cx="100" cy="95" r="2.5"/>
      <circle cx="120" cy="80" r="3"/>
      <circle cx="140" cy="65" r="2.5"/>
      <circle cx="160" cy="55" r="3"/>
      <circle cx="180" cy="50" r="2.5"/>
