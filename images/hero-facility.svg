    <g>
      <ellipse cx="38" cy="52" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="73" cy="54" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="108" cy="52" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="143" cy="54" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="178" cy="52" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="213" cy="54" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="248" cy="52" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="283" cy="54" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="318" cy="52" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="353" cy="54" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="388" cy="52" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="423" cy="54" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="458" cy="52" rx="18" ry="18" fill="url(#logEnd)"/>
    </g>
    <g>
      <ellipse cx="55" cy="84" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="90" cy="86" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="125" cy="84" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="160" cy="86" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="195" cy="84" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="230" cy="86" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="265" cy="84" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="300" cy="86" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="335" cy="84" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="370" cy="86" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="405" cy="84" rx="18" ry="18" fill="url(#logEnd)"/>
      <ellipse cx="440" cy="86" rx="18" ry="18" fill="url(#logEnd)"/>
    </g>
    <!-- Rings on logs -->
    <g fill="none" stroke="#5a3d1c" stroke-width="1" opacity="0.5">
      <circle cx="20" cy="20" r="12"/>
      <circle cx="20" cy="20" r="6"/>
      <circle cx="55" cy="20" r="12"/>
      <circle cx="90" cy="18" r="12"/>
      <circle cx="90" cy="18" r="6"/>
      <circle cx="160" cy="18" r="12"/>
      <circle cx="230" cy="18" r="12"/>
      <circle cx="230" cy="18" r="6"/>
      <circle cx="300" cy="18" r="12"/>
      <circle cx="370" cy="18" r="12"/>
      <circle cx="370" cy="18" r="6"/>
      <circle cx="440" cy="18" r="12"/>
      <circle cx="108" cy="52" r="12"/>
      <circle cx="178" cy="52" r="12"/>
      <circle cx="178" cy="52" r="6"/>
      <circle cx="248" cy="52" r="12"/>
      <circle cx="318" cy="52" r="12"/>
      <circle cx="318" cy="52" r="6"/>
      <circle cx="388" cy="52" r="12"/>
      <circle cx="55" cy="84" r="12"/>
      <circle cx="125" cy="84" r="12"/>
      <circle cx="125" cy="84" r="6"/>
      <circle cx="195" cy="84" r="12"/>
      <circle cx="265" cy="84" r="12"/>
      <circle cx="265" cy="84" r="6"/>
      <circle cx="335" cy="84" r="12"/>
      <circle cx="405" cy="84" r="12"/>
    </g>
  </g>

  <!-- ====== EXCAVATOR (center-left foreground) ====== -->
  <g transform="translate(620, 400)">
    <!-- Tracks -->
    <rect x="-10" y="100" width="150" height="22" rx="10" fill="#2a2a2a"/>
    <g fill="#1a1a1a">
      <rect x="0" y="105" width="12" height="12"/>
      <rect x="20" y="105" width="12" height="12"/>
      <rect x="40" y="105" width="12" height="12"/>
      <rect x="60" y="105" width="12" height="12"/>
      <rect x="80" y="105" width="12" height="12"/>
      <rect x="100" y="105" width="12" height="12"/>
      <rect x="120" y="105" width="12" height="12"/>
    </g>
    <!-- Wheels -->
    <circle cx="10" cy="111" r="10" fill="#3a3a3a"/>
    <circle cx="130" cy="111" r="10" fill="#3a3a3a"/>
    <!-- Main body -->
    <rect x="5" y="60" width="130" height="45" rx="4" fill="url(#excavator)"/>
    <!-- Cab -->
    <path d="M20 20 L75 20 L75 60 L20 60 Z" fill="url(#excavator)"/>
    <rect x="25" y="25" width="45" height="30" fill="#5a7a9a" opacity="0.7"/>
    <!-- Boom (arm up) -->
    <path d="M70 40 L150 10 L158 20 L80 50 Z" fill="url(#excavator)"/>
    <!-- Stick -->
    <path d="M145 15 L200 50 L195 60 L140 25 Z" fill="url(#excavator)"/>
    <!-- Grapple -->
    <g transform="translate(195, 55)">
      <path d="M0 0 L15 20 L5 25 L-10 10 Z" fill="#2a2a2a"/>
      <path d="M0 0 L-15 20 L-25 10 L-10 -5 Z" fill="#2a2a2a"/>
      <circle cx="0" cy="0" r="4" fill="#1a1a1a"/>
    </g>
    <!-- Logs held in grapple -->
    <g transform="translate(180, 85)">
      <ellipse cx="0" cy="0" rx="8" ry="8" fill="url(#logEnd)"/>
      <ellipse cx="18" cy="0" rx="8" ry="8" fill="url(#logEnd)"/>
      <ellipse cx="9" cy="-14" rx="8" ry="8" fill="url(#logEnd)"/>
    </g>
    <!-- Highlights -->
    <rect x="10" y="63" width="120" height="4" fill="#ffd870" opacity="0.6"/>
  </g>

  <!-- ====== BIOMASS CONVEYOR (right side) ====== -->
  <g transform="translate(1240, 300)">
    <!-- Support frame -->
    <polygon points="0,180 20,180 100,30 80,30" fill="url(#steel)"/>
    <polygon points="100,30 200,30 220,180 200,180" fill="#5a6a5c"/>
    <!-- Belt -->
